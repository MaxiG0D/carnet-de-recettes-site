<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carnet de Recettes</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="./">Carnet de Recettes</a><nav><a href="telecharger.html">Télécharger</a></nav></header>
<main><section class="hero"><div><h1>Vos recettes, bien rangées.</h1><div class="row"><a class="btn" href="telecharger.html">Télécharger pour Mac</a></div></div>
<img src="images/nouilles-ramen-au-porc-epice.webp" alt=""></section>
<div class="grid" id="grid"></div></main>
<script>fetch('recipes.json').then(r=>r.json()).then(l=>{grid.innerHTML=l.map(x=>`<div class="card"><img src="${x.image}" alt="" loading="lazy"><div><h3>${x.title}</h3><small>${x.total_time||''}</small></div></div>`).join('')})</script>
<footer><a href="telecharger.html">Télécharger</a><a href="confidentialite.html">Confidentialité</a></footer></body></html>
