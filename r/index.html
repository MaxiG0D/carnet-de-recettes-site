<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recette</title><link rel="stylesheet" href="../style.css"></head><body>
<header><a class="brand" href=".././">Carnet de Recettes</a></header>
<main id="app"></main>
<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function decode(h){
  let z=h.startsWith('z.'); if(z)h=h.slice(2);
  h=h.replace(/-/g,'+').replace(/_/g,'/'); h+='='.repeat((4-h.length%4)%4);
  let b=Uint8Array.from(atob(h),c=>c.charCodeAt(0));
  if(z){b=new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}
  return JSON.parse(new TextDecoder().decode(b));
}
(async()=>{
  const app=document.getElementById('app');
  try{
    const r=await decode(location.hash.slice(1)); document.title=r.t;
    const meta=[r.time,r.por].filter(Boolean).join(' · ');
    app.innerHTML=(r.img?`<div class="recipe-hero"><img src="${esc(r.img)}" alt=""><h1>${esc(r.t)}</h1></div>`:`<h1 class="page">${esc(r.t)}</h1>`)
     +(meta?`<p class="meta">${esc(meta)}</p>`:'')
     +`<div class="cta"><a class="btn" href="carnetderecettes://import${location.hash}">Ouvrir dans Carnet</a><a class="btn alt" href="../">Télécharger</a></div>`
     +`<div class="cols"><div><h2>Ingrédients</h2><ul>${(r.ing||[]).map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div><div><h2>Préparation</h2><ol class="steps">${(r.steps||[]).map(i=>`<li>${esc(i)}</li>`).join('')}</ol></div></div>`;
  }catch(e){app.innerHTML='<h1 class="page">Lien invalide</h1>'}
})();
</script>
<footer><a href="../confidentialite.html">Confidentialité</a></footer></body></html>
