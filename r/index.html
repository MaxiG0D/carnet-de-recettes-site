<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recette</title><link rel="stylesheet" href="../style.css?v=3"></head><body>
<header><a class="brand" href=".././">Carnet de Recettes</a></header>
<main id="app"></main>
<script>
// iCloud public database (CloudKit Web Services). API tokens are read-only and meant to be public.
const CK={production:{container:'iCloud.com.max.carnetderecettes',token:'4149166e0d1444c080852ae21644f873a6d07fe89d89618cca7f820f2f5cefde'},development:{container:'iCloud.com.max.carnetderecettes.dev',token:'7bda1c0ecc350190e6a3eceb598796fbf93f2a7989242fb612b59a9859cb342e'}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function fromLink(h){
  let z=h.startsWith('z.'); if(z)h=h.slice(2);
  h=h.replace(/-/g,'+').replace(/_/g,'/'); h+='='.repeat((4-h.length%4)%4);
  let b=Uint8Array.from(atob(h),c=>c.charCodeAt(0));
  if(z){b=new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}
  return JSON.parse(new TextDecoder().decode(b));
}
async function fromICloud(id,env){
  const res=await fetch(`https://api.apple-cloudkit.com/database/1/${CK[env].container}/${env}/public/records/lookup?ckAPIToken=${CK[env].token}`,
    {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({records:[{recordName:id}]})});
  const rec=(await res.json()).records?.[0];
  if(!rec||!rec.fields)throw new Error('not found');
  const f=k=>rec.fields[k]?.value;
  const photo=f('photo')?.downloadURL?.replace('${f}','photo.jpg');
  return {t:f('title'),time:f('time'),por:f('portions'),ing:f('ingredients'),steps:f('steps'),img:photo||f('source')};
}
function render(r){
  document.title=r.t||'Recette';
  const meta=[r.time,r.por].filter(Boolean).join(' · ');
  app.innerHTML=(r.img?`<div class="recipe-hero"><img src="${esc(r.img)}" alt="" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add('noimg');this.remove()"><h1>${esc(r.t)}</h1></div>`:`<h1 class="page">${esc(r.t)}</h1>`)
   +(meta?`<p class="meta">${esc(meta)}</p>`:'')
   +`<div class="cols"><div><h2>Ingrédients</h2><ul>${(r.ing||[]).map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div><div><h2>Préparation</h2><ol class="steps">${(r.steps||[]).map(i=>`<li>${esc(i)}</li>`).join('')}</ol></div></div>`
   +`<div class="cta"><a class="btn" href="../">Télécharger Carnet de Recettes</a></div>`;
}
(async()=>{
  const q=new URLSearchParams(location.search), id=[...q.keys()].find(k=>k!=='dev');
  try{ render(id?await fromICloud(id,q.has('dev')?'development':'production'):await fromLink(location.hash.slice(1))) }
  catch(e){app.innerHTML='<h1 class="page">Recette introuvable</h1><div class="cta"><a class="btn" href="../">Carnet de Recettes</a></div>'}
})();
</script>
<footer><a href="../confidentialite.html">Confidentialité</a></footer></body></html>
